org.gradle.parallel=true
org.gradle.configuration-cache=true
# Optional: Keep building even if an unoptimized third-party plugin throws a cache warning
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.daemon=true
# Give it 4GB to 6GB depending on your local machine's RAM limits
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
